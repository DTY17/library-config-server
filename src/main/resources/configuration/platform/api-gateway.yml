server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/api/books/**

            - id: record-service
              uri: lb://record-service
              predicates:
                - Path=/api/records/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/