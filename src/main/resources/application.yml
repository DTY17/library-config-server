server:
  port: 9000

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        git:
          uri: https://github.com/DTY17/library-config-yml.git
        native:
          search-locations:
            - classpath:/configuration
            - classpath:/configuration/platform
            - classpath:/configuration/service
